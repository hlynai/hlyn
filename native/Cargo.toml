[package]
name = "hlyn"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
description = "C-ABI shim over the upstream Landlock crate."

[lib]
name = "hlyn"
# rlib alongside cdylib so `cargo test` can link the crate as a library. The
# shipped artifact is still the cdylib; this only makes the code reachable
# from a test harness.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Maintained under the landlock-lsm organisation by Landlock's own kernel
# author. All ABI detection, struct layout, and access-bit masking live here
# rather than in our code; this crate is the reason none of that is hand-rolled.
landlock = "0.4"
# Only for the read-only ABI version query in `hlyn_abi`.
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
