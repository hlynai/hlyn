[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hlyn"
version = "0.0.1"
description = "Kernel-enforced environment for AI agents: declare what an agent may read, write, run and reach; everything else is denied."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []
# "sandbox" is what people type into PyPI's search; it's the one place hlyn
# uses the word for itself (CLAUDE.md, "Product rules").
keywords = [
    "environment", "sandbox", "ai-agents", "llm", "security", "containment",
    "landlock", "seccomp", "seatbelt", "prompt-injection",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.scripts]
hlyn = "hlyn.cli:main"

# PyInstaller finds hlyn's hook here, which bundles its native libraries.
[project.entry-points.pyinstaller40]
hook-dirs = "hlyn.__pyinstaller:get_hook_dirs"

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "mutmut>=3"]

[tool.hatch.build.targets.wheel]
packages = ["src/hlyn"]

# The source distribution carries exactly what a build from source needs: the
# package, both Rust crates (without their build output), the build hook and
# the tests. Research notes, tooling and fuzzing corpora stay in the repo.
[tool.hatch.build.targets.sdist]
include = [
    "/src/hlyn",
    "/native/Cargo.toml",
    "/native/Cargo.lock",
    "/native/src",
    "/native/report/Cargo.toml",
    "/native/report/Cargo.lock",
    "/native/report/src",
    "/hatch_build.py",
    "/tests",
    "/README.md",
    "/LICENSE",
]
exclude = ["*.so", "__pycache__", ".DS_Store"]

# Compiles the Landlock shim and puts it beside the package, so an installed
# wheel can confine without a build tree next to it. See hatch_build.py.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
# The longest lines here are argparse declarations, where one flag per line is
# more readable than the same flag wrapped across three.
line-length = 110
target-version = "py310"
# One-off kernel and Seatbelt experiments (see its README), written to be read
# next to their FINDINGS.md entries rather than maintained as product code.
extend-exclude = ["tools/hostlab"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import order
    "UP",           # constructs that a supported Python does better
    "B",            # bugbear: the mistakes that look correct
    "SIM", "FURB",  # simplifications
    "S",            # bandit: worth having in a security tool
    "BLE",          # blind excepts, which this codebase uses deliberately and
                    # therefore has to justify one at a time
    "PLC", "PLE", "PLW",
    "RUF",
]
ignore = [
    # Lazy imports are load-bearing here. The platform backends must never be
    # imported on the platform they cannot run on, and `import hlyn` has to
    # stay cheap enough that nothing about it can fail before a policy exists.
    "PLC0415",
    # Module-level state -- the loaded shim, the seal flag, the log sink -- is
    # deliberately process-wide, because that is the scope of the thing it
    # describes. A process is either sealed or it is not.
    "PLW0603",
]
# PLR is deliberately absent: it counts branches and arguments, and the
# functions here that trip it are the ones that must handle every case.

[tool.ruff.lint.per-file-ignores]
# A test suite is asserts and subprocesses; flagging them says nothing.
# Hardcoded /tmp paths in tests are the subject under test, not a mistake.
"tests/*" = ["S101", "S603", "S607", "S108"]
"tools/*" = ["S101", "S603", "S607"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/hlyn"]
# PyInstaller's hook: named for PyInstaller (`hook-hlyn`, not an importable
# module) and run only inside it.
exclude = ["src/hlyn/__pyinstaller/hook-hlyn\\.py$"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Resolved against the rootdir, so the suite imports the package sitting next
# to it rather than whatever happens to be installed. That matters for any
# tool that runs the tests against a copy of the tree -- mutation testing
# copies the source elsewhere and runs there, and without this the tests
# silently import the unmutated original instead.
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "linux: requires a Linux kernel with Landlock and seccomp",
    "mac: requires macOS Seatbelt",
    "escape: adversarial test that must fail the build if the escape succeeds",
]

# Mutation testing, run by tools/mutate.sh.
#
# Scoped to the policy layer on purpose. Everything below it is judged by
# whether a real kernel refuses a real syscall, which a mutant cannot fake but
# also cannot be measured this way; the policy layer is pure decision-making,
# where a mutant that survives means a boundary nobody is checking.
[tool.mutmut]
source_paths = ["src/hlyn/"]
pytest_add_cli_args_test_selection = [
    "tests/test_policy.py",
    "tests/test_policy_properties.py",
]
# mutmut re-reads this config, relative to the working directory, every time a
# mutated function is called. One test deliberately runs policy code from a
# different directory, which leaves mutmut unable to find its own source. The
# test earns its place -- it is what proves presets read the working directory
# at call time rather than baking it in at import -- so it is skipped here
# rather than weakened.
pytest_add_cli_args = [
    "--deselect",
    "tests/test_policy.py::test_presets_are_computed_late_not_at_import",
]
