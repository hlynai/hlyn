[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hlyn"
version = "0.0.1"
description = "Runtime containment layer for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.scripts]
hlyn = "hlyn.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]

[tool.hatch.build.targets.wheel]
packages = ["src/hlyn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "linux: requires a Linux kernel with Landlock and seccomp",
    "mac: requires macOS Seatbelt",
    "escape: adversarial test that must fail the build if the escape succeeds",
]
